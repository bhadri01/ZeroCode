name: Web CI

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'

jobs:
  build:
    name: pnpm install + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck (app + docs)
        run: pnpm -r typecheck

      - name: Build (app + docs + assemble dist)
        run: pnpm build

      - name: Sanity-check dist
        run: |
          test -f dist/index.html
          test -f dist/playground.html
          test -f dist/docs/index.html
          test -f dist/docs/quickstart/index.html
          echo "web/dist contents:"
          find dist -maxdepth 3 -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 7
