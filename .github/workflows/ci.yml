name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace -- -D warnings

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
          components: rustfmt
      - run: cargo fmt --all -- --check

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
      - run: cargo install cargo-deny --locked
      - run: cargo deny check

  docker-runner:
    name: Docker Runner Image
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f runners/Dockerfile .

  docker-service:
    name: Docker Service Image
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile.service .

  # ── Integration tests against a real Postgres instance ──────────────
  # Applies every migration against a live postgres:16 service before
  # running the workspace test suite. This catches three classes of bug
  # that pure unit tests miss:
  #   1. Migration SQL that fails on PG16 specifically — e.g. the
  #      `binary` keyword regression that silently broke `compile_artifacts`
  #      creation (fixed in `ae57bfd`). A migration-apply step here
  #      surfaces those as hard CI failures.
  #   2. Schema drift between code and DB — the `sqlx::query!` macro
  #      validates against the live schema with `SQLX_OFFLINE=false`.
  #   3. End-to-end DB round-trips for any test that wants `DATABASE_URL`.
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [check]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zerocode
          POSTGRES_PASSWORD: zerocode
          POSTGRES_DB: zerocode_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U zerocode"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgres://zerocode:zerocode@localhost:5432/zerocode_test
      # Force live-DB sqlx checks instead of the `.sqlx/` offline cache so
      # column-rename mistakes blow up CI immediately.
      SQLX_OFFLINE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
      - uses: Swatinem/rust-cache@v2
      - name: Apply migrations (regression guard for PG16 keyword bugs)
        run: cargo run -p zerocode-migrate
      - name: Verify expected schema
        run: |
          # Belt-and-suspenders check: confirm the columns the worker
          # actually queries exist by name. If a migration is silently
          # broken (e.g. PG16 `binary` keyword) this fails loudly even
          # if `cargo run -p zerocode-migrate` somehow exited 0.
          psql "$DATABASE_URL" -c "\d submissions" | grep -q batch_id
          psql "$DATABASE_URL" -c "\d compile_artifacts" | grep -q artifact_data
      - name: Run integration tests
        run: cargo test --workspace

  # ── End-to-end smoke test — full stack, real HTTP, real auth ────────
  # Builds the runner + service images, brings the docker compose stack
  # up, and runs `scripts/smoke-test.sh` against it. This is the only
  # job that exercises authenticated REST + gRPC requests end-to-end,
  # so it's the regression guard for runtime-config bugs like the
  # `tower_governor` `ConnectInfo` issue (fixed in `9a8c6a3`) that
  # never showed up in unit tests because they don't speak HTTP.
  smoke-test:
    name: Smoke Test (full stack)
    runs-on: ubuntu-latest
    needs: [check, docker-runner, docker-service]
    steps:
      - uses: actions/checkout@v4
      - name: Build runner image
        run: docker build -f runners/Dockerfile.slim --target full -t zerocode-runner:dev .
      - name: Install grpcurl
        run: |
          curl -sSL https://github.com/fullstorydev/grpcurl/releases/download/v1.9.3/grpcurl_1.9.3_linux_x86_64.tar.gz \
            | sudo tar -xz -C /usr/local/bin grpcurl
      - name: Run smoke test
        run: bash scripts/smoke-test.sh
