name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace -- -D warnings

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
          components: rustfmt
      - run: cargo fmt --all -- --check

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
      - run: cargo install cargo-deny --locked
      - run: cargo deny check

  docker-runner:
    name: Docker Runner Image
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f runners/Dockerfile .

  docker-service:
    name: Docker Service Image
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile.service .

  # ── Integration tests against a real Postgres instance ──────────────
  # This job will enable real DB tests once sqlx offline mode is set up.
  # For now it runs the full workspace test suite with DATABASE_URL
  # available so that any sqlx compile-time checks can resolve against
  # a live schema. To add migration-dependent tests, run sqlx migrate
  # before cargo test and remove the offline feature flag from sqlx.
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [check]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zerocode
          POSTGRES_PASSWORD: zerocode
          POSTGRES_DB: zerocode_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U zerocode"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
      - uses: Swatinem/rust-cache@v2
      - name: Run integration tests
        run: cargo test --workspace
        env:
          DATABASE_URL: postgres://zerocode:zerocode@localhost:5432/zerocode_test
