# ======================================================================
# v1.5 Batch E — .NET family
#
# The SDK writes to $HOME (.dotnet, .nuget) and phones home unless told not
# to, so HOME/cache are pinned to writable /tmp and telemetry is disabled.
# Sandboxed runs have no network: NuGet packages are pre-restored into a
# baked, read-only cache at /usr/local/lib/zerocode/nuget (see runner
# Dockerfile) and C# builds against a pre-restored project skeleton with
# `--no-restore`. NOTE: .NET is the highest-risk batch — validate against a
# real build + sandbox before relying on it.
# ======================================================================

[[language]]
id = 140
name = "C#"
version = ".NET 9"
source_file = "main.cs"
# Compile the single source file with the Roslyn compiler (csc) directly via the
# baked csharp/build.sh — NOT `dotnet build`. MSBuild peaks ~130 MB and ~3 s even
# for a hello-world, and since the compile phase shares the submission cgroup it
# dominated both the reported memory and the wall time; csc does the same job in
# under a second in a fraction of the memory. The output assembly is `app.dll`
# (+ app.runtimeconfig.json) under /box/bin. build.sh routes csc's diagnostics to
# stderr so compile errors reach compile_output and never leak into stdout.
compile_cmd = ["/bin/sh", "/usr/local/lib/zerocode/csharp/build.sh"]
run_cmd = ["/bin/sh", "-c", "mkdir -p /tmp/.dotnet/shm && cd /box/bin && exec dotnet app.dll"]
env = [
    ["HOME", "/tmp"],
    ["DOTNET_CLI_HOME", "/tmp"],
    ["DOTNET_CLI_TELEMETRY_OPTOUT", "1"],
    ["DOTNET_NOLOGO", "1"],
    ["NUGET_PACKAGES", "/usr/local/lib/zerocode/nuget"],
    # Workstation GC, not Server GC — Server GC reserves a heap segment per CPU
    # at startup and blows past the cgroup, surfacing as CoreCLR failing with
    # 0x8007000E (E_OUTOFMEMORY). Workstation GC uses a single, modest heap.
    ["DOTNET_gcServer", "0"],
    # Suppress the "An issue was encountered verifying workloads" notice that
    # otherwise leaks into the submission's stdout.
    ["DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE", "1"],
]
# csc + `dotnet app.dll` covers compile+run. Limits stay generous (the cgroup is
# shared across both phases) but well below the old MSBuild-era headroom.
default_limits = { cpu_time = 15.0, wall_time = 30.0, memory_mb = 512, max_pids = 128, max_stdout = 65536, max_stderr = 65536, enable_network = false }
compile_limits = { cpu_time = 20.0, wall_time = 40.0, memory_mb = 768, max_pids = 128, max_stdout = 65536, max_stderr = 65536, enable_network = false }
is_archived = false

[[language]]
id = 141
name = "F#"
version = ".NET 9"
source_file = "main.fsx"
compile_cmd = []
# Pre-create the .NET named-mutex shm dir (see C# note) before launching fsi.
run_cmd = ["/bin/sh", "-c", "mkdir -p /tmp/.dotnet/shm && exec /usr/bin/dotnet fsi --nologo main.fsx"]
env = [
    ["HOME", "/tmp"],
    ["DOTNET_CLI_HOME", "/tmp"],
    ["DOTNET_CLI_TELEMETRY_OPTOUT", "1"],
    ["DOTNET_NOLOGO", "1"],
    ["NUGET_PACKAGES", "/usr/local/lib/zerocode/nuget"],
    # Workstation GC (see C# note) — avoids CoreCLR 0x8007000E at startup.
    ["DOTNET_gcServer", "0"],
    # Make the GC give committed pages back to the OS aggressively (0–9 scale),
    # trading a little CPU for a lower resident footprint — fsi's baseline is the
    # bulk of F#'s memory, so this is the main lever short of compiling to a dll.
    ["DOTNET_GCConserveMemory", "9"],
    ["DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE", "1"],
    # `dotnet fsi` loads the SDK, which runs a workload manifest integrity check
    # and prints "An issue was encountered verifying workloads…" to stderr. It's
    # a warning, not an error (the script still runs), but it leaks into the
    # submission's captured stderr — skip the check to keep output clean.
    ["DOTNET_SKIP_WORKLOAD_INTEGRITY_CHECK", "1"],
]
# `dotnet fsi` JITs and starts a full .NET runtime — generous startup headroom.
default_limits = { cpu_time = 20.0, wall_time = 45.0, memory_mb = 1536, max_pids = 128, max_stdout = 65536, max_stderr = 65536, enable_network = false }
is_archived = false

