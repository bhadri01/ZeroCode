[[language]]
id = 164
name = "Julia"
version = "1.x"
source_file = "main.jl"
compile_cmd = []
# NOTE: tried -O0 --compile=min -t 1 to shrink the footprint — it backfired
# (RSS jumped ~68MB → ~270MB, likely the interpreter path retaining more), so
# we keep plain startup. Julia's memory is floored by its sysimage + JIT; the
# real lever would be a trimmed custom sysimage (PackageCompiler), not flags.
run_cmd = ["/usr/local/bin/julia", "--startup-file=no", "main.jl"]
env = [
    ["HOME", "/tmp"],
    ["JULIA_DEPOT_PATH", "/tmp/.julia"],
]
# Julia's first-run JIT + stdlib precompile is heavy on both CPU and memory.
default_limits = { cpu_time = 20.0, wall_time = 45.0, memory_mb = 1024, max_pids = 96, max_stdout = 65536, max_stderr = 65536, enable_network = false }
is_archived = false

