[[language]]
id = 120
name = "Kotlin"
version = "2.x"
source_file = "main.kt"
# `-J` forwards JVM flags to kotlinc itself. kotlinc spins up a full JVM that
# loads the entire Kotlin compiler, which dominated the submission's peak memory.
# Cap its heap/metaspace/code-cache and use SerialGC + C1-only JIT (one GC
# thread, no C2) — the same tuning as the javac compile (id 62).
compile_cmd = [
    "/usr/bin/kotlinc",
    "-J-XX:+UseSerialGC", "-J-XX:TieredStopAtLevel=1",
    "-J-Xmx512m", "-J-XX:MaxMetaspaceSize=256m", "-J-XX:ReservedCodeCacheSize=64m",
    "main.kt", "-include-runtime", "-d", "prog.jar",
]
# JVM flags on the java command line (not JAVA_TOOL_OPTIONS) so the JVM doesn't
# print "Picked up JAVA_TOOL_OPTIONS: ..." to stderr. SerialGC + a capped
# reserved code cache mirror the Java (id 62) run and keep the run footprint
# small; full tiered JIT is kept so compute-heavy solutions still get C2.
run_cmd = ["/usr/bin/java", "-XX:+UseSerialGC", "-Xmx${jvm_heap_mb}m", "-Xss512k", "-XX:MaxMetaspaceSize=128m", "-XX:ReservedCodeCacheSize=64m", "-XX:+ExitOnOutOfMemoryError", "-jar", "prog.jar"]
env = []
# `kotlinc -include-runtime` building a fat jar is the slowest, heaviest compile
# in the set → compile_limits 1024. The run is `java -jar` with -Xmx${jvm_heap_mb}m
# (= memory_mb-256 = 256 MB heap), so default_limits 512 covers heap+metaspace+
# codecache; memory.max shrinks 1024→512 at the compile→run barrier. 512 is also
# what admission reserves per Kotlin job (was 1024).
default_limits = { cpu_time = 25.0, wall_time = 55.0, memory_mb = 512, max_pids = 128, max_stdout = 65536, max_stderr = 65536, enable_network = false }
compile_limits = { cpu_time = 30.0, wall_time = 60.0, memory_mb = 1024, max_pids = 128, max_stdout = 65536, max_stderr = 65536, enable_network = false }
is_archived = false

[[language]]
id = 121
name = "Scala"
version = "3.x"
source_file = "main.scala"
# The entrypoint class name is DETECTED, not assumed. Scala 3 names the class
# after the entry point, not the file, so hardcoding one name only ever works
# for one source shape:
#
#   @main def main()                    -> main.class        (the old hardcoded name)
#   object Main { def main(...) }       -> Main.class        <- classic idiom, FAILED
#   @main def run()                     -> run.class         <- FAILED
#
# Both failures surfaced as `Error: Could not find or load main class main` with
# a non_zero_exit status — i.e. idiomatic Scala looked like the student's bug.
#
# scalac also emits companion/synthetic classes (`Main$`, `main$package`,
# `main$package$`), and in all three shapes above the entry point is the unique
# emitted class whose name contains NO `$`. So: filter those out, prefer `Main`
# then `main` for the case where user-defined helper classes add candidates, and
# write the winner to `.entry`. That file lives in /box, so it is captured in the
# compile-cache artifact and restored on a cache hit alongside the .class files.
compile_cmd = ["/bin/sh", "-c", "/usr/bin/scalac main.scala && ls *.class | grep -v '\\$' | sed 's/\\.class$//' > .cands && { grep -qx Main .cands && echo Main || { grep -qx main .cands && echo main || head -1 .cands; }; } > .entry && rm -f .cands"]
# Run the compiled class directly with `java`, mirroring the plain-Java entry.
# We can't use the default Scala 3 `scala` (the Scala-CLI runner that fetches
# the toolchain over the network and can't run offline), and the classic
# `scala_legacy` launcher invokes the deprecated dotty.tools.MainGenericRunner,
# which prints a "MainGenericRunner ... deprecated since Scala 3.5.0" warning to
# stderr on every run. Running java directly avoids both: scala.jar bundles the
# scala3 + scala2.13 standard library, so `-cp .:scala.jar <entry>` runs offline
# and warning-free. JVM flags go inline here because plain java (unlike the
# wrapper scripts) does NOT read JAVA_OPTS.
run_cmd = ["/bin/sh", "-c", "exec /usr/bin/java -XX:+UseSerialGC -Xmx${jvm_heap_mb}m -Xss512k -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=64m -XX:+ExitOnOutOfMemoryError -cp .:/usr/local/scala3-3.5.2/lib/scala.jar \"$(cat .entry)\""]
env = [
    # JAVA_OPTS bounds the scalac wrapper during the compile phase (scalac reads
    # JAVA_OPTS and passes it to java — unlike JAVA_TOOL_OPTIONS, it doesn't
    # trigger the "Picked up ..." stderr banner). SerialGC + C1-only JIT keep
    # scalac's cold-start footprint down. The run phase uses java directly with
    # the flags inline above, so it ignores this.
    ["JAVA_OPTS", "-XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xmx${jvm_heap_mb}m -Xss512k -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=64m -XX:+ExitOnOutOfMemoryError"],
]
# scalac cold-start + compile is JVM-heavy → compile_limits 1024. The run is
# `java -cp` with -Xmx${jvm_heap_mb}m (256 MB heap), so default_limits 512 covers
# the run; memory.max shrinks 1024→512 at the barrier (and 512 is what admission
# reserves per Scala job, was 1024).
default_limits = { cpu_time = 25.0, wall_time = 55.0, memory_mb = 512, max_pids = 128, max_stdout = 65536, max_stderr = 65536, enable_network = false }
compile_limits = { cpu_time = 30.0, wall_time = 60.0, memory_mb = 1024, max_pids = 128, max_stdout = 65536, max_stderr = 65536, enable_network = false }
is_archived = false

[[language]]
id = 140
name = "C#"
version = ".NET 9"
source_file = "main.cs"
# Compile the single source file with the Roslyn compiler (csc) directly via the
# baked csharp/build.sh — NOT `dotnet build`. MSBuild peaks ~130 MB and ~3 s even
# for a hello-world, and since the compile phase shares the submission cgroup it
# dominated both the reported memory and the wall time; csc does the same job in
# under a second in a fraction of the memory. The output assembly is `app.dll`
# (+ app.runtimeconfig.json) under /box/bin. build.sh routes csc's diagnostics to
# stderr so compile errors reach compile_output and never leak into stdout.
compile_cmd = ["/bin/sh", "/usr/local/lib/zerocode/csharp/build.sh"]
run_cmd = ["/bin/sh", "-c", "mkdir -p /tmp/.dotnet/shm && cd /box/bin && exec dotnet app.dll"]
env = [
    ["HOME", "/tmp"],
    ["DOTNET_CLI_HOME", "/tmp"],
    ["DOTNET_CLI_TELEMETRY_OPTOUT", "1"],
    ["DOTNET_NOLOGO", "1"],
    ["NUGET_PACKAGES", "/usr/local/lib/zerocode/nuget"],
    # Workstation GC, not Server GC — Server GC reserves a heap segment per CPU
    # at startup and blows past the cgroup, surfacing as CoreCLR failing with
    # 0x8007000E (E_OUTOFMEMORY). Workstation GC uses a single, modest heap.
    ["DOTNET_gcServer", "0"],
    # Suppress the "An issue was encountered verifying workloads" notice that
    # otherwise leaks into the submission's stdout.
    ["DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE", "1"],
]
# csc compile gets compile_limits 768; `dotnet app.dll` runs in ~5 MB so
# default_limits drops to 256. memory.max shrinks 768→256 at the compile→run
# barrier, and 256 is what admission reserves per C# job (was 512).
default_limits = { cpu_time = 15.0, wall_time = 30.0, memory_mb = 256, max_pids = 128, max_stdout = 65536, max_stderr = 65536, enable_network = false }
compile_limits = { cpu_time = 20.0, wall_time = 40.0, memory_mb = 768, max_pids = 128, max_stdout = 65536, max_stderr = 65536, enable_network = false }
is_archived = false

[[language]]
id = 152
name = "Swift"
version = "6.x"
source_file = "main.swift"
compile_cmd = ["/usr/local/bin/swiftc", "-O", "-o", "prog", "main.swift"]
run_cmd = ["./prog"]
# Disable Swift's crash backtracer: it spawns a helper that uses ptrace-style
# introspection the sandbox blocks, turning a clean error into a SIGILL during
# backtracing. With /proc now landlock-readable, swiftc itself should run.
env = [
    ["SWIFT_BACKTRACE", "enable=no"],
]
# swiftc is among the heaviest compilers (CPU + memory) → compile_limits 1024.
# The run is a ~1.5 MB native binary, so default_limits drops to 128: memory.max
# shrinks 1024→128 at the compile→run barrier, and 128 is what admission reserves
# per Swift job (was 1024 — the biggest density win in the set, ~8×).
default_limits = { cpu_time = 25.0, wall_time = 50.0, memory_mb = 128, max_pids = 128, max_stdout = 65536, max_stderr = 65536, enable_network = false }
compile_limits = { cpu_time = 25.0, wall_time = 50.0, memory_mb = 1024, max_pids = 128, max_stdout = 65536, max_stderr = 65536, enable_network = false }
is_archived = false

