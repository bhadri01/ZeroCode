[[language]]
id = 60
name = "Go"
version = "1.x-latest"
source_file = "main.go"
compile_cmd = ["/usr/local/go/bin/go", "build", "-o", "prog", "main.go"]
run_cmd = ["./prog"]
env = [
    # GOPATH/GOCACHE writes go to /tmp (writable tmpfs); /box stays clean
    # for the artifact and the source.
    ["GOCACHE", "/tmp/.go-cache"],
    ["GOTMPDIR", "/tmp"],
    ["GOMAXPROCS", "1"],
    # Soft memory ceiling — Go's GC will work harder as we approach it. Set
    # slightly below cgroup memory.max so the runtime gets a chance to free
    # before the kernel OOM-kills us.
    ["GOMEMLIMIT", "${memory_mb}MiB"],
]
is_archived = false

[[language]]
id = 62
name = "Java"
version = "21"
source_file = "Main.java"
compile_cmd = ["/usr/bin/javac", "Main.java"]
run_cmd = ["/usr/bin/java", "Main"]
env = [
    # -Xmx uses jvm_heap_mb (memory_mb − 256 MB JVM overhead) so the heap
    # plus metaspace/code-cache/threads stays under the cgroup memory.max.
    # ExitOnOutOfMemoryError makes the JVM exit(1) on OOM instead of hanging
    # trying to dump heap.
    ["JAVA_TOOL_OPTIONS", "-Xmx${jvm_heap_mb}m -Xss512k -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=64m -XX:+ExitOnOutOfMemoryError"],
]
# JVM needs more headroom than native languages: 512 MB memory (256 heap +
# 256 overhead), 96 pids (JVM thread floor), and longer wall time for JIT.
default_limits = { cpu_time = 5.0, wall_time = 15.0, memory_mb = 512, max_pids = 96, max_stdout = 65536, max_stderr = 65536, enable_network = false }
compile_limits = { cpu_time = 15.0, wall_time = 30.0, memory_mb = 512, max_pids = 128, max_stdout = 65536, max_stderr = 65536, enable_network = false }
is_archived = false

