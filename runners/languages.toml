[[language]]
id = 73
name = "Rust"
version = "1.x-latest"
source_file = "main.rs"
# The runner image installs rustup with RUSTUP_HOME=/usr/local/rustup and
# CARGO_HOME=/usr/local/cargo (see runners/Dockerfile), so the rustc proxy
# lives at `/usr/local/cargo/bin/rustc` — there is no `/usr/bin/rustc` symlink.
# The proxy reads RUSTUP_HOME + CARGO_HOME to locate the toolchain.
compile_cmd = ["/usr/local/cargo/bin/rustc", "-O", "-C", "panic=abort", "-C", "linker=gcc-14", "main.rs", "-o", "prog"]
