# Language specs loaded by the API/worker at boot. New languages are added
# here and in `runners/Dockerfile`. ID space:
#   1–99    Core 7 (v1)
#
# Substitutions available in env values:
#   ${memory_mb}   the per-submission memory cap, in MB
#   ${cpu_time}    CPU budget in seconds
#   ${wall_time}   wall-clock budget in seconds
#   ${max_pids}    max processes/threads in the cgroup
#   ${jvm_heap_mb} max(memory_mb − 256, 32) — JVM heap ceiling accounting for
#                  metaspace, code cache, thread stacks, and GC overhead
#
# Compiled languages run two phases inside the same sandbox: compile sub-child
# first, then if it exits zero the outer process execvpes the run_cmd. A
# non-zero compile sub-child causes the outer process to exit with the
# sentinel `253`, which the worker maps to Status::CompileError with the
# compiler's stderr routed into `compile_output`.

[[language]]
id = 48
name = "C"
version = "gcc-14"
source_file = "main.c"
compile_cmd = ["/usr/bin/gcc-14", "-O2", "-std=c17", "-fstack-protector-strong", "-D_FORTIFY_SOURCE=2", "main.c", "-o", "prog", "-lm"]
run_cmd = ["./prog"]
env = []
is_archived = false

[[language]]
id = 52
name = "C++"
version = "g++-14"
source_file = "main.cpp"
compile_cmd = ["/usr/bin/g++-14", "-O2", "-std=c++23", "-fstack-protector-strong", "-D_FORTIFY_SOURCE=2", "main.cpp", "-o", "prog", "-lm"]
run_cmd = ["./prog"]
env = []
is_archived = false

[[language]]
id = 60
name = "Go"
version = "1.x-latest"
source_file = "main.go"
compile_cmd = ["/usr/local/go/bin/go", "build", "-o", "prog", "main.go"]
run_cmd = ["./prog"]
env = [
    # GOROOT must be set explicitly. Without it, Go falls back to deriving the
    # install dir from /proc/self/exe, which dies inside chroot'd sandboxes
    # with "go binary is trimmed and GOROOT is not set".
    ["GOROOT", "/usr/local/go"],
    ["GOCACHE", "/tmp/.go-cache"],
    ["GOTMPDIR", "/tmp"],
    ["GOMAXPROCS", "1"],
    ["GOMEMLIMIT", "${memory_mb}MiB"],
]
# `go build` of a hello world routinely takes 2–6 s on Docker Desktop's
# Linux VM (compiler + linker + stdlib link). The default 5 s wall trips
# this. NaiveSandbox (dev) shares the wall budget between compile and run,
# so we raise default_limits.wall_time; NativeSandbox (prod) will use the
# per-phase compile_limits split.
default_limits  = { cpu_time = 10.0, wall_time = 30.0, memory_mb = 256, max_pids = 64, max_stdout = 65536, max_stderr = 65536, enable_network = false }
compile_limits  = { cpu_time = 15.0, wall_time = 30.0, memory_mb = 512, max_pids = 96, max_stdout = 65536, max_stderr = 65536, enable_network = false }
is_archived = false

[[language]]
id = 62
name = "Java"
version = "21"
source_file = "Main.java"
compile_cmd = ["/usr/bin/javac", "Main.java"]
# JVM flags go on the command line, not in JAVA_TOOL_OPTIONS — the JVM prints
# "Picked up JAVA_TOOL_OPTIONS: ..." to stderr whenever that env var is set,
# which leaks into the user-visible output and there's no flag to silence it.
run_cmd = [
    "/usr/bin/java",
    "-Xmx${jvm_heap_mb}m",
    "-Xss512k",
    "-XX:MaxMetaspaceSize=128m",
    "-XX:ReservedCodeCacheSize=64m",
    "-XX:+ExitOnOutOfMemoryError",
    "Main",
]
env = []
default_limits = { cpu_time = 5.0, wall_time = 15.0, memory_mb = 512, max_pids = 96, max_stdout = 65536, max_stderr = 65536, enable_network = false }
compile_limits = { cpu_time = 15.0, wall_time = 30.0, memory_mb = 512, max_pids = 128, max_stdout = 65536, max_stderr = 65536, enable_network = false }
is_archived = false

[[language]]
id = 63
name = "Node.js"
version = "22"
source_file = "main.js"
compile_cmd = []
run_cmd = ["/usr/bin/node", "main.js"]
env = [
    ["NODE_NO_WARNINGS", "1"],
    ["NODE_OPTIONS", "--max-old-space-size=${memory_mb} --unhandled-rejections=strict"],
]
is_archived = false

[[language]]
id = 71
name = "Python"
version = "3.13"
source_file = "main.py"
compile_cmd = []
run_cmd = ["/usr/bin/python3.13", "main.py"]
env = [
    ["PYTHONUNBUFFERED", "1"],
    ["PYTHONDONTWRITEBYTECODE", "1"],
]
is_archived = false

[[language]]
id = 73
name = "Rust"
version = "1.x-latest"
source_file = "main.rs"
# `/usr/bin/rustc` is a symlink to the rustup proxy at `/root/.cargo/bin/rustc`
# in the current runner image (rustup installed with default $HOME=/root).
# The proxy reads RUSTUP_HOME + CARGO_HOME to locate the toolchain.
compile_cmd = ["/usr/bin/rustc", "-O", "-C", "panic=abort", "-C", "linker=gcc-14", "main.rs", "-o", "prog"]
run_cmd = ["./prog"]
env = [
    # Rustup needs a toolchain selection — there's no `rustup default` baked
    # into the runner rootfs. `stable` lets rustup pick whichever stable-*
    # toolchain is installed (matches the host arch).
    ["RUSTUP_TOOLCHAIN", "stable"],
    # Must match the paths the runner image actually used at install time.
    # Mismatches surface as "no toolchain installed" or "could not read sysroot".
    ["RUSTUP_HOME", "/root/.rustup"],
    ["CARGO_HOME", "/root/.cargo"],
]
is_archived = false
