# ======================================================================
# v1.5 Batch G — Modern languages (beyond Judge0)
# ======================================================================

# NOTE: Zig (id 160) was removed — `zig build-exe` fails in the sandbox because
# the per-submission tmpfs returns EXDEV on cross-directory rename, which Zig's
# cache commit relies on. Reserved id 160 is intentionally left unused.

[[language]]
id = 161
name = "Nim"
version = "2.x"
source_file = "main.nim"
compile_cmd = ["/usr/bin/nim", "c", "-d:release", "--out:prog", "--nimcache:/tmp/.nim-cache", "main.nim"]
run_cmd = ["./prog"]
env = [
    ["NIM_CACHE_DIR", "/tmp/.nim-cache"],
]
# Nim compiles via a C backend (gcc), so it pays both nim + gcc costs.
default_limits = { cpu_time = 15.0, wall_time = 30.0, memory_mb = 512, max_pids = 96, max_stdout = 65536, max_stderr = 65536, enable_network = false }
is_archived = false

[[language]]
id = 162
name = "Crystal"
version = "1.x"
source_file = "main.cr"
compile_cmd = ["/usr/bin/crystal", "build", "--release", "-o", "prog", "main.cr"]
run_cmd = ["./prog"]
env = [
    # Crystal writes a compiler cache under $HOME/.cache/crystal.
    ["HOME", "/tmp"],
    ["XDG_CACHE_HOME", "/tmp/.cache"],
    ["CRYSTAL_CACHE_DIR", "/tmp/.crystal-cache"],
]
# Crystal --release is an LLVM optimizing build; CPU + memory heavy.
default_limits = { cpu_time = 25.0, wall_time = 50.0, memory_mb = 1024, max_pids = 128, max_stdout = 65536, max_stderr = 65536, enable_network = false }
