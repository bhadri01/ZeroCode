# ======================================================================
# v1.5 Batch C — JVM family
#
# Wrapper-script launchers (scalac/scala, groovy, clojure) can't take JVM
# flags on the command line the way `java` can, so heap/stack caps go via
# JAVA_TOOL_OPTIONS. The JVM prints "Picked up JAVA_TOOL_OPTIONS: ..." to
# stderr when that var is set — accepted here as the price of capping
# wrapper-launched JVMs (the Core 7 Java entry avoids it via CLI flags).
# ======================================================================

[[language]]
id = 120
name = "Kotlin"
version = "2.x"
source_file = "main.kt"
# `-J` forwards JVM flags to kotlinc itself. kotlinc spins up a full JVM that
# loads the entire Kotlin compiler, which dominated the submission's peak memory.
# Cap its heap/metaspace/code-cache and use SerialGC + C1-only JIT (one GC
# thread, no C2) — the same tuning as the javac compile (id 62).
compile_cmd = [
    "/usr/bin/kotlinc",
    "-J-XX:+UseSerialGC", "-J-XX:TieredStopAtLevel=1",
    "-J-Xmx512m", "-J-XX:MaxMetaspaceSize=256m", "-J-XX:ReservedCodeCacheSize=64m",
    "main.kt", "-include-runtime", "-d", "prog.jar",
]
# JVM flags on the java command line (not JAVA_TOOL_OPTIONS) so the JVM doesn't
# print "Picked up JAVA_TOOL_OPTIONS: ..." to stderr. SerialGC + a capped
# reserved code cache mirror the Java (id 62) run and keep the run footprint
# small; full tiered JIT is kept so compute-heavy solutions still get C2.
run_cmd = ["/usr/bin/java", "-XX:+UseSerialGC", "-Xmx${jvm_heap_mb}m", "-Xss512k", "-XX:MaxMetaspaceSize=128m", "-XX:ReservedCodeCacheSize=64m", "-XX:+ExitOnOutOfMemoryError", "-jar", "prog.jar"]
env = []
# NativeSandbox applies default_limits to BOTH compile and run (compile_limits
# is not yet wired), and `kotlinc -include-runtime` building a fat jar is the
# slowest compile in the set — so default_limits carries the full headroom.
default_limits = { cpu_time = 25.0, wall_time = 55.0, memory_mb = 1024, max_pids = 128, max_stdout = 65536, max_stderr = 65536, enable_network = false }
compile_limits = { cpu_time = 30.0, wall_time = 60.0, memory_mb = 1024, max_pids = 128, max_stdout = 65536, max_stderr = 65536, enable_network = false }
is_archived = false

[[language]]
id = 121
name = "Scala"
version = "3.x"
source_file = "main.scala"
compile_cmd = ["/usr/bin/scalac", "main.scala"]
# Run the compiled class directly with `java`, mirroring the plain-Java entry.
# We can't use the default Scala 3 `scala` (the Scala-CLI runner that fetches
# the toolchain over the network and can't run offline), and the classic
# `scala_legacy` launcher invokes the deprecated dotty.tools.MainGenericRunner,
# which prints a "MainGenericRunner ... deprecated since Scala 3.5.0" warning to
# stderr on every run. Running java directly avoids both: scala.jar bundles the
# scala3 + scala2.13 standard library, so `-cp .:scala.jar main` runs offline
# and warning-free. JVM flags go inline here because plain java (unlike the
# wrapper scripts) does NOT read JAVA_OPTS.
run_cmd = ["/usr/bin/java", "-XX:+UseSerialGC", "-Xmx${jvm_heap_mb}m", "-Xss512k", "-XX:MaxMetaspaceSize=128m", "-XX:ReservedCodeCacheSize=64m", "-XX:+ExitOnOutOfMemoryError", "-cp", ".:/usr/local/scala3-3.5.2/lib/scala.jar", "main"]
env = [
    # JAVA_OPTS bounds the scalac wrapper during the compile phase (scalac reads
    # JAVA_OPTS and passes it to java — unlike JAVA_TOOL_OPTIONS, it doesn't
    # trigger the "Picked up ..." stderr banner). SerialGC + C1-only JIT keep
    # scalac's cold-start footprint down. The run phase uses java directly with
    # the flags inline above, so it ignores this.
    ["JAVA_OPTS", "-XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xmx${jvm_heap_mb}m -Xss512k -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=64m -XX:+ExitOnOutOfMemoryError"],
]
# scalac cold-start + compile is JVM-heavy; default_limits covers compile+run.
default_limits = { cpu_time = 25.0, wall_time = 55.0, memory_mb = 1024, max_pids = 128, max_stdout = 65536, max_stderr = 65536, enable_network = false }
compile_limits = { cpu_time = 30.0, wall_time = 60.0, memory_mb = 1024, max_pids = 128, max_stdout = 65536, max_stderr = 65536, enable_network = false }
is_archived = false

[[language]]
id = 122
name = "Groovy"
version = "4.x"
source_file = "main.groovy"
compile_cmd = []
run_cmd = ["/usr/bin/groovy", "main.groovy"]
env = [
    # Wrapper launchers (scala/groovy/clojure) read JAVA_OPTS and pass it to
    # java — unlike JAVA_TOOL_OPTIONS, it doesn't trigger the "Picked up ..."
    # stderr banner. If a launcher ignores it, the JVM's container-aware
    # defaults still bound the heap to the cgroup.
    ["JAVA_OPTS", "-XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xmx${jvm_heap_mb}m -Xss512k -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=64m -XX:+ExitOnOutOfMemoryError"],
]
default_limits = { cpu_time = 10.0, wall_time = 30.0, memory_mb = 512, max_pids = 96, max_stdout = 65536, max_stderr = 65536, enable_network = false }
is_archived = false

