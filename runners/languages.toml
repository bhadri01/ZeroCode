[[language]]
id = 150
name = "COBOL"
version = "gnucobol"
source_file = "main.cob"
# The trailing object links the libxml2 version-skew silencer (built into the
# runner image by runners/Dockerfile) into the binary, suppressing libcob's
# spurious "compiled against libxml 212 using older 209" warning on every run
# (Debian trixie libxml2 skew). See runners/cob_xml_quiet.c.
compile_cmd = ["/usr/bin/cobc", "-x", "-O2", "-o", "prog", "main.cob", "/usr/local/lib/zerocode/cobol/cob_xml_quiet.o"]
run_cmd = ["./prog"]
env = []
is_archived = false

