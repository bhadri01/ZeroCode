[[language]]
id = 163
name = "Dart"
version = "3.x"
source_file = "main.dart"
# `dart compile exe` always prints "Generated: <path>" to stdout (no verbosity
# flag suppresses it), which would leak into the program's stdout. Redirect the
# compile-phase stdout to stderr → compile_output. `exec` preserves the exit code.
compile_cmd = ["/bin/sh", "-c", "exec /usr/bin/dart compile exe main.dart -o prog 1>&2"]
run_cmd = ["./prog"]
env = [
    ["HOME", "/tmp"],
    ["DART_DISABLE_ANALYTICS", "1"],
]
# `dart compile exe` AOT-compiles to a native binary → compile_limits 768. The
# run is a ~11 MB native binary, so default_limits drops to 256: memory.max
# shrinks 768→256 at the compile→run barrier, and 256 is what admission reserves
# per Dart job (was 768).
default_limits = { cpu_time = 20.0, wall_time = 40.0, memory_mb = 256, max_pids = 96, max_stdout = 65536, max_stderr = 65536, enable_network = false }
compile_limits = { cpu_time = 20.0, wall_time = 40.0, memory_mb = 768, max_pids = 96, max_stdout = 65536, max_stderr = 65536, enable_network = false }
is_archived = false
