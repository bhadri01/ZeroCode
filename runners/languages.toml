    # into the runner rootfs. `stable` lets rustup pick whichever stable-*
    # toolchain is installed (matches the host arch).
    ["RUSTUP_TOOLCHAIN", "stable"],
    # Must match the paths the runner image actually used at install time.
    # Mismatches surface as "no toolchain installed" or "could not read sysroot".
    ["RUSTUP_HOME", "/usr/local/rustup"],
    ["CARGO_HOME", "/usr/local/cargo"],
]
is_archived = false

