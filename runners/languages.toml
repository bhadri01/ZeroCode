# Language specs loaded by the API/worker at boot. New languages are added
# here and in `runners/Dockerfile`. Supported set (20 languages, trimmed from
# the v1.5 catalogue of 60 to the most-requested / popular tier):
#   Compiled : C (48), C++ (52), Go (60), Java (62), Rust (73), Kotlin (120),
#              Scala (121), C# (140), Swift (152), Dart (163)
#   Scripting: Node.js (63), Python (71), Bash (100), Lua (101), Perl (102),
#              Ruby (103), R (104), PHP (105), TypeScript (106), SQL (154)
#
# Substitutions available in env values:
#   ${memory_mb}   the per-submission memory cap, in MB
#   ${cpu_time}    CPU budget in seconds
#   ${wall_time}   wall-clock budget in seconds
#   ${max_pids}    max processes/threads in the cgroup
#   ${jvm_heap_mb} max(memory_mb − 256, 32) — JVM heap ceiling accounting for
#                  metaspace, code cache, thread stacks, and GC overhead
#
# Compiled languages run two phases inside the same sandbox: compile sub-child
# first, then if it exits zero the outer process execvpes the run_cmd. A
# non-zero compile sub-child causes the outer process to exit with the
# sentinel `253`, which the worker maps to Status::CompileError with the
# compiler's stderr routed into `compile_output`.
#
# MEMORY ACCOUNTING — PER-PHASE ceilings (cold, no compile cache): compiled
# languages run two phases in one cgroup, and the sandbox now sizes memory.max
# per phase. The cgroup is created at `compile_limits.memory_mb` (compiler
# headroom); at the compile→run boundary it reclaims the compiler's page cache,
# resets the peak, and DROPS memory.max to `default_limits.memory_mb`. So:
#   • compile_limits.memory_mb  must clear the cold compiler's peak (rustc / g++ /
#     kotlinc / swiftc alone exceed 100 MB). Used only as the compile ceiling.
#   • default_limits.memory_mb  needs only cover the RUN phase — and it is what the
#     worker admission controller reserves per job, so keeping it tight packs far
#     more concurrent jobs per node. (For JVM/Go/Node it also feeds the runtime
#     heap knob — ${jvm_heap_mb}, GOMEMLIMIT, --max-old-space-size — so don't
#     shrink those below a sane run heap.)
# Reported `memory` reflects RUN-phase peak only.
#
# WHICH `compile_limits` FIELDS ARE HONOURED:
#   • memory_mb  — yes. cgroup created at it, shrunk to the run budget at the barrier.
#   • wall_time  — yes. The compile phase is killed at `compile_limits.wall_time`;
#                  the RUN phase then gets a FRESH `default_limits.wall_time`
#                  measured from the barrier, not from job start. Sharing one
#                  budget is what let a slow compile surface as
#                  `time_limit_exceeded` with empty stdout on a correct program —
#                  i.e. a wrong grade. Size each phase for its own work.
#   • max_pids   — yes. Compile gets the larger ceiling (compilers fork helpers:
#                  cc1plus/as/ld, javac threads, `sh -c` pipelines), then it
#                  drops to the run budget at the barrier.
#   • cpu_time   — NOT read, and it no longer matters: the reported `time` and the
#                  CPU-limit check are both run-phase-only, so the compiler's CPU
#                  is never charged against the submission's cpu_time_limit.
#   • max_stdout / max_stderr / enable_network — not read; taken from default_limits.
# Reported `time` is RUN-phase CPU; the compile phase is reported separately as
# `compile_time` (see docs/STATUS.md).

[[language]]
id = 48
name = "C"
version = "gcc-14"
source_file = "main.c"
compile_cmd = ["/usr/bin/gcc-14", "-O2", "-std=c17", "-fstack-protector-strong", "-D_FORTIFY_SOURCE=2", "main.c", "-o", "prog", "-lm"]
run_cmd = ["./prog"]
env = []
is_archived = false

[[language]]
id = 52
name = "C++"
version = "g++-14"
source_file = "main.cpp"
# `-O0 -pipe` keeps the cold compile of `<iostream>` hello-worlds under
# 100 ms on Docker Desktop. `-O2` was ~5× slower without measurable
# benefit for short-lived sandboxed runs. `-pipe` skips the cc1plus →
# as intermediate temp file. Stack-protector + FORTIFY are dropped here
# because the sandbox is the real security boundary; reintroduce on a
# `--profile prod` build of the languages file if needed.
compile_cmd = ["/usr/bin/g++-14", "-O0", "-pipe", "-std=c++23", "main.cpp", "-o", "prog", "-lm"]
run_cmd = ["./prog"]
env = []
# COMPILE CEILING — sized for `#include <bits/stdc++.h>`, which is what real
# student C++ actually looks like. Measured cold g++ peaks, 1 CPU:
#   <iostream> only ...................  114 MB / ~0.3 s
#   20 explicit std headers ...........  154 MB / ~1.5 s
#   <bits/stdc++.h> WITH the baked PCH   106 MB / ~0.9 s
#   <bits/stdc++.h> without the PCH ...  294 MB / ~3.4 s
# The old 192 MB ceiling sat *between* the last two. The PCH (runners/Dockerfile)
# keeps the common path at ~106 MB, but the fallback path still has to fit —
# GCC silently ignores the PCH whenever the include isn't first in the
# translation unit, so any student who writes `#include <iostream>` above their
# `#include <bits/stdc++.h>` lands on the 294 MB path. At 192 MB that submission
# did not fail cleanly: the footprint is mostly reclaimable page cache, so the
# cgroup thrashed in reclaim rather than OOMing, and the job burned its whole
# wall budget to report `time_limit_exceeded` with memory pinned at exactly the
# ceiling. 512 MB clears the fallback with headroom.
#
# This does NOT change what the admission controller reserves: the worker
# reserves default_limits.memory_mb (the RUN budget, 128 MB), and memory.max is
# shrunk back to it at the compile→run barrier. Only the transient compile
# ceiling moves.
default_limits = { cpu_time = 10.0, wall_time = 15.0, memory_mb = 128, max_pids = 64, max_stdout = 65536, max_stderr = 65536, enable_network = false }
compile_limits = { cpu_time = 10.0, wall_time = 15.0, memory_mb = 512, max_pids = 64, max_stdout = 65536, max_stderr = 65536, enable_network = false }
is_archived = false

[[language]]
id = 60
name = "Go"
version = "1.x-latest"
source_file = "main.go"
# Go's build cache MUST be writable: `go build` writes new action outputs and a
# periodic `trim.txt` into GOCACHE, so pointing it straight at the read-only
# baked rootfs cache fails with
#   go: failed to trim cache: open /var/cache/go-build/trim.txt: permission denied
#
# We used to seed it with `cp -r`, copying the whole ~147 MB stdlib cache into
# the per-job /tmp tmpfs. That copy was the single most expensive thing in the
# engine and it scaled terribly: the tmpfs is cgroup-accounted, so N concurrent
# cold Go compiles meant N x 147 MB of memory churn. Measured: 8 concurrent cold
# compiles took 8.3-8.7 s each (vs ~2.9 s alone) — enough to threaten the wall
# budget, and a wall-killed graded submission comes back with EMPTY STDOUT,
# which a grader scores as a wrong answer against a correct program.
#
# `cp -rs` builds a farm of SYMLINKS into the baked cache instead of copying it.
# Go reads straight through them and writes only genuinely new entries as real
# files in the farm. Measured on a read-only rootfs, single CPU:
#     cp -r  : 2012 ms seed + 836 ms build = 2848 ms,  147 MB of tmpfs
#     cp -rs :  241 ms seed + 567 ms build =  808 ms,  9.5 MB of tmpfs
# 3.5x faster and 15x less memory, which is what actually removes the
# concurrency cliff.
#
# `rm -f trim.txt` is REQUIRED and its absence is a time bomb, not a style nit:
# Go trims at most once per `trimInterval` (24 h, cmd/go/internal/cache/cache.go)
# by rewriting trim.txt. Through the farm that path resolves into the read-only
# image, so builds keep working for exactly 24 h after each image build and then
# every Go submission starts failing. Deleting the symlink makes Go create a real
# writable trim.txt in the farm, which is time-independent.
#
# The farm is still torn down before the run phase: /tmp is cgroup-accounted and
# the compile->run barrier shrinks memory.max back to default_limits.memory_mb.
# Identical resubmissions skip all of this via ZeroCode's Postgres compile cache.
compile_cmd = ["/bin/sh", "-c", "cp -rs /var/cache/go-build /tmp/gocache && rm -f /tmp/gocache/trim.txt && /usr/local/go/bin/go build -o prog main.go && rm -rf /tmp/gocache"]
run_cmd = ["./prog"]
env = [
    # GOROOT must be set explicitly. Without it, Go falls back to deriving the
    # install dir from /proc/self/exe, which dies inside chroot'd sandboxes
    # with "go binary is trimmed and GOROOT is not set".
    ["GOROOT", "/usr/local/go"],
    # Writable seeded copy of the baked stdlib cache (populated in compile_cmd).
    # -trimpath MUST match the bake's flags or the content-hash keys won't hit.
    ["GOCACHE", "/tmp/gocache"],
    ["GOTMPDIR", "/tmp"],
    ["GOFLAGS", "-trimpath"],
    ["GOMAXPROCS", "1"],
    ["GOMEMLIMIT", "${memory_mb}MiB"],
]
# Compile phase needs headroom for the 147 MB cache copy (it lands in the
# cgroup-accounted /tmp tmpfs) plus the compiler/linker RSS, hence 1024 MB / 45 s
# at compile. The run phase shrinks back to a lean 256 MB heap; GOMEMLIMIT feeds
# the runtime GC off default_limits.memory_mb, so don't shrink that below what
# user programs need.
default_limits  = { cpu_time = 8.0, wall_time = 12.0, memory_mb = 256, max_pids = 64, max_stdout = 65536, max_stderr = 65536, enable_network = false }
compile_limits  = { cpu_time = 30.0, wall_time = 45.0, memory_mb = 1024, max_pids = 96, max_stdout = 65536, max_stderr = 65536, enable_network = false }
is_archived = false

[[language]]
id = 62
name = "Java"
version = "21"
source_file = "Main.java"
# javac's JVM startup is the dominant cost of a Java submission. Two levers:
#   1. SerialGC (one GC thread) + C1-only JIT (TieredStopAtLevel=1) — fewer
#      threads contending for the sandbox's single CPU.
#   2. A prebuilt CDS archive of the compiler's classes (baked into the runner
#      image at /usr/local/lib/zerocode/javac.jsa) — nearly halves javac
#      startup (~640 ms -> ~340 ms under 1 CPU).
# We invoke the compiler via `java -m jdk.compiler/...` (what `javac` wraps) so
# we can attach `-XX:SharedArchiveFile`. Behaviour + exit codes match `javac`,
# so compile-error detection is unchanged. If the archive is missing/mismatched
# the JVM silently ignores it. The archive is regenerated when the JDK changes.
compile_cmd = [
    "/usr/bin/java",
    "-XX:+UseSerialGC",
    "-XX:TieredStopAtLevel=1",
    "-XX:SharedArchiveFile=/usr/local/lib/zerocode/javac.jsa",
    "-m", "jdk.compiler/com.sun.tools.javac.Main",
    "Main.java",
]
# JVM flags go on the command line, not in JAVA_TOOL_OPTIONS — the JVM prints
# "Picked up JAVA_TOOL_OPTIONS: ..." to stderr whenever that env var is set,
# which leaks into the user-visible output and there's no flag to silence it.
# UseSerialGC speeds run-phase startup too (no parallel GC threads at the small
# heaps we cap to); we keep full tiered JIT on the run so compute-heavy
# solutions still get C2.
run_cmd = [
    "/usr/bin/java",
    "-XX:+UseSerialGC",
    "-Xmx${jvm_heap_mb}m",
    "-Xss512k",
    "-XX:MaxMetaspaceSize=128m",
    "-XX:ReservedCodeCacheSize=64m",
    "-XX:+ExitOnOutOfMemoryError",
    "Main",
]
env = []
default_limits = { cpu_time = 5.0, wall_time = 15.0, memory_mb = 512, max_pids = 96, max_stdout = 65536, max_stderr = 65536, enable_network = false }
compile_limits = { cpu_time = 15.0, wall_time = 30.0, memory_mb = 512, max_pids = 128, max_stdout = 65536, max_stderr = 65536, enable_network = false }
is_archived = false

