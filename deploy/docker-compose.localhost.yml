# Localhost-only override: publishes the API on http://localhost:8080.
#
# The base compose (docker-compose.yml) is shaped for the production VPS
# where Traefik routes by Host header — no host port is published. Layer
# this file on top to expose the API to your Mac for local testing.
#
# Usage:
#   docker compose \
#     -f deploy/docker-compose.yml \
#     -f deploy/docker-compose.localhost.yml \
#     up -d
#
# Then hit:
#   curl http://localhost:8080/v1/health
#   curl http://localhost:8080/v1/languages | jq

services:
  api:
    ports:
      - "8080:8080"
