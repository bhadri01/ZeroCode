# Dev overrides:
#   - Expose Postgres on host port 5433 so dev tooling (cargo run, sqlx-cli,
#     psql) can reach the dev database without colliding with a host-local
#     Postgres on 5432.
#   - Skip the api/worker/runner-rootfs-init services via the "never" profile;
#     run them manually via cargo or `docker compose run` for hot-reload.
#
# Usage:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml up -d postgres migrate
#   DATABASE_URL=postgres://zerocode:zerocode@localhost:5433/zerocode cargo run -p zerocode-api
#   DATABASE_URL=postgres://zerocode:zerocode@localhost:5433/zerocode cargo sqlx prepare --workspace

services:
  postgres:
    ports:
      - "5433:5432"

  api:
    profiles: ["never"]

  worker:
    profiles: ["never"]

  runner-rootfs-init:
    profiles: ["never"]
