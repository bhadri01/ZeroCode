# Local dev stack. Not production — `--privileged` defaults are off, but the
# host preconditions from docs/DEPLOY.md still apply (cgroups v2, kernel >=
# 5.14, unprivileged_userns_clone=1, etc.).
#
# The `runner-rootfs` named volume is populated by `runner-rootfs-init` from
# the `zerocode-runner` image's filesystem; both the worker (Phase 1.5+) and
# the rootfs-init mount it.

name: zerocode

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: zerocode
      POSTGRES_PASSWORD: zerocode
      POSTGRES_DB: zerocode
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zerocode"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: zerocode-service:dev
    entrypoint: ["/usr/local/bin/zerocode-migrate"]
    command:
      - --database-url=postgres://zerocode:zerocode@postgres:5432/zerocode
      - --migrations-dir=/var/lib/zerocode/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  runner-rootfs-init:
    # Extract the runner image's filesystem into the shared named volume so the
    # worker can bind-mount it as the sandbox rootfs. One-shot.
    image: zerocode-runner:dev
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        # Clear old contents without touching "." or "..".
        for path in /target/* /target/.[!.]* /target/..?*; do
          [ -e "$$path" ] || continue
          rm -rf -- "$$path"
        done
        # Copy the runner image filesystem, but skip pseudo-filesystems and the
        # target mount itself so procfs/sysfs entries do not get baked in.
        tar -C / \
          --exclude=./target \
          --exclude=./dev \
          --exclude=./proc \
          --exclude=./sys \
          --exclude=./tmp \
          -cf - . | tar -C /target -xf -
        echo "runner rootfs ready"
    volumes:
      - runner-rootfs:/target
    restart: "no"

  api:
    image: zerocode-service:dev
    environment:
      DATABASE_URL: postgres://zerocode:zerocode@postgres:5432/zerocode
      ZEROCODE_API_BIND: 0.0.0.0:8080
      ZEROCODE_GRPC_BIND: 0.0.0.0:9091
      ZEROCODE_API_KEY: dev-only-replace-me
      # Browser-facing controls — integrated playground enabled by default.
      ZEROCODE_CORS_ORIGINS: "*"
      ZEROCODE_ALLOW_ANONYMOUS: "true"
      ZEROCODE_ANON_MAX_PER_WINDOW: ${ZEROCODE_ANON_MAX_PER_WINDOW:-10}
      ZEROCODE_ANON_WINDOW_SECS: ${ZEROCODE_ANON_WINDOW_SECS:-60}
      RUST_LOG: info,zerocode=debug
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
      - "9091:9091"
    # Mount the local `web/` directory into the container during development
    # so edits to the UI are served immediately without rebuilding the image.
    volumes:
      - ../web:/web:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  worker:
    image: zerocode-worker:dev
    environment:
      DATABASE_URL: postgres://zerocode:zerocode@postgres:5432/zerocode
      ZEROCODE_WORKER_ID: worker-1
      ZEROCODE_RUNNER_ROOTFS: /var/lib/zerocode/runner-rootfs
      RUST_LOG: info,zerocode=debug
    depends_on:
      migrate:
        condition: service_completed_successfully
      runner-rootfs-init:
        condition: service_completed_successfully
    volumes:
      # Read-write in dev mode so NaiveSandbox can create per-job workdirs at
      # <rootfs>/box/<token> before chroot()-ing into the rootfs. In a
      # NativeSandbox deployment this should go back to :ro.
      - runner-rootfs:/var/lib/zerocode/runner-rootfs:rw
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cap_drop: ["ALL"]
    cap_add:
      # Needed inside the worker's own user namespace for unshare/mount/pivot_root.
      - SYS_ADMIN
      # Needed by NaiveSandbox to chroot() into the runner rootfs.
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
    cgroup: private
    restart: unless-stopped

volumes:
  pg-data:
  runner-rootfs:
