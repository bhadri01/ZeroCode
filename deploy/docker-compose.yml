# ZeroCode stack: Postgres + migrate + runner-rootfs init + API + worker.
#
# Works out of the box on any host with Docker:
#   docker compose -f deploy/docker-compose.yml up -d
#
# Reachable at http://localhost:8080 once the API is healthy.
#
# Host prerequisites are documented in docs/DEPLOY.md §1 — most importantly
# kernel >= 5.14, cgroup v2 unified hierarchy, and unprivileged user
# namespaces enabled (the worker fails its preflight otherwise).
#
# For production behind a Traefik reverse proxy, see the optional block at
# the bottom of this file.

name: zerocode

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: zerocode
      POSTGRES_PASSWORD: zerocode
      POSTGRES_DB: zerocode
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U zerocode" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - default

  migrate:
    image: zerocode-service:dev
    entrypoint: [ "/usr/local/bin/zerocode-migrate" ]
    command:
      - --database-url=postgres://zerocode:zerocode@postgres:5432/zerocode
      - --migrations-dir=/var/lib/zerocode/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - default

  runner-rootfs-init:
    # One-shot: extract the runner image's filesystem into the shared volume
    # so the worker can bind-mount it as the sandbox rootfs.
    image: zerocode-runner:dev
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        set -eu
        # Wipe old contents (skip "." and "..") then re-extract.
        for path in /target/* /target/.[!.]* /target/..?*; do
          [ -e "$$path" ] || continue
          rm -rf -- "$$path"
        done
        # Skip pseudo-filesystems so procfs/sysfs entries are not baked in.
        tar -C / \
          --exclude=./target \
          --exclude=./dev \
          --exclude=./proc \
          --exclude=./sys \
          --exclude=./tmp \
          -cf - . | tar -C /target -xf -
        echo "runner rootfs ready"
    volumes:
      - runner-rootfs:/target
    restart: "no"
    networks:
      - default

  api:
    image: zerocode-service:dev
    environment:
      DATABASE_URL: postgres://zerocode:zerocode@postgres:5432/zerocode
      # Per-IP rate limit (tower_governor). The 100/100 production default
      # is fine for real users but trips on dev hammering; override here
      # via env var if you want stricter behaviour.
      ZEROCODE_GOVERNOR_RPS: ${ZEROCODE_GOVERNOR_RPS:-10000}
      ZEROCODE_GOVERNOR_BURST: ${ZEROCODE_GOVERNOR_BURST:-10000}
      RUST_LOG: info,zerocode=debug
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    # Traefik discovery labels — inert without a Traefik instance. To
    # actually route through Traefik, also uncomment the `networks` block
    # at the bottom of this file.
    labels:
      - traefik.enable=true
      - traefik.http.routers.zero-code.rule=Host(`zerocode.dev.succeedex.in`)
      - traefik.http.routers.zero-code.entrypoints=websecure
      - traefik.http.routers.zero-code.tls=true
      - traefik.http.routers.zero-code.tls.certresolver=myresolver
      - traefik.http.services.zero-code.loadbalancer.server.port=8080
    # The service image bakes the built web/dist/ at /srv/web (Dockerfile.service
    # runs `pnpm build` in a node:20 stage). ZEROCODE_WEB_DIR=/srv/web is set
    # there, so the API picks it up automatically. For dev hot-reload of the
    # UI, run `pnpm --filter @zerocode/app dev` on port 5173 separately.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ "ALL" ]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - default

  worker:
    image: zerocode-worker:dev
    environment:
      DATABASE_URL: postgres://zerocode:zerocode@postgres:5432/zerocode
      # ZEROCODE_WORKER_ID is intentionally NOT set. Each worker auto-generates
      # a unique `worker-<ulid>` at boot, so you can run many replicas without
      # them colliding on identity (the stuck-job sweeper attributes claims by
      # this id). Set it explicitly only if you want a stable, named single
      # worker.
      ZEROCODE_RUNNER_ROOTFS: /var/lib/zerocode/runner-rootfs
      # Per-IP rate limiting lives on the API; per-worker concurrency is bounded
      # by ZEROCODE_MAX_PARALLEL (defaults to the container's CPU count).
      RUST_LOG: info,zerocode=debug
    depends_on:
      migrate:
        condition: service_completed_successfully
      runner-rootfs-init:
        condition: service_completed_successfully
    volumes:
      # Read-write so the NaiveSandbox can create per-job workdirs at
      # <rootfs>/box/<token> and bind-mount /proc + /dev into the rootfs.
      # The sandbox isolates user code from mutating toolchain files.
      - runner-rootfs:/var/lib/zerocode/runner-rootfs:rw
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cap_drop: [ "ALL" ]
    cap_add:
      # Required for unshare/mount/pivot_root inside the worker's user namespace
      # AND for the /proc bind-mount the NaiveSandbox does at startup.
      - SYS_ADMIN
      # Required by NaiveSandbox to chroot() into the runner rootfs.
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
      # Docker's default AppArmor profile (docker-default) denies the mount()
      # syscall even when CAP_SYS_ADMIN is granted, which breaks the sandbox's
      # /proc + /dev bind-mounts into the runner rootfs on AppArmor hosts
      # (e.g. Ubuntu). Unconfine *only* the worker so those binds succeed.
      - apparmor=unconfined
    cgroup: private
    restart: unless-stopped
    # Horizontal scaling: bump replicas, or override at the CLI with
    #   docker compose -f deploy/docker-compose.yml up -d --scale worker=4
    # Keep (API 16 + workers × 4) under Postgres max_connections (default 100)
    # — roughly 20 workers before you need PgBouncer or a higher limit.
    deploy:
      replicas: 1
    networks:
      - default

volumes:
  pg-data:
  runner-rootfs:

    # ─── Optional: Traefik integration ─────────────────────────────────────
    # Uncomment to join the `traefik` external network so a host-level Traefik
    # reverse proxy can route by Host header (rules in the labels above).
    # Create the network once on the host before bringing up:
    #   docker network create traefik
    # When Traefik is fronting the stack, the `ports: 8080:8080` mapping above
    # becomes redundant — remove it to keep the API off the public host port.
    #
networks:
  default:
    name: traefik
    external: true
