# Local dev stack. Not production — `--privileged` defaults are off, but the
# host preconditions from docs/DEPLOY.md still apply (cgroups v2, kernel >=
# 5.14, unprivileged_userns_clone=1, etc.).
#
# The `runner-rootfs` named volume is populated by `runner-rootfs-init` from
# the `zerocode-runner` image's filesystem; both the worker (Phase 1.5+) and
# the rootfs-init mount it.

name: zerocode

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: zerocode
      POSTGRES_PASSWORD: zerocode
      POSTGRES_DB: zerocode
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U zerocode" ]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: zerocode-service:dev
    entrypoint: [ "/usr/local/bin/zerocode-migrate" ]
    command:
      - --database-url=postgres://zerocode:zerocode@postgres:5432/zerocode
      - --migrations-dir=/var/lib/zerocode/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  runner-rootfs-init:
    # Extract the runner image's filesystem into the shared named volume so the
    # worker can bind-mount it as the sandbox rootfs. One-shot.
    image: zerocode-runner:dev
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        set -eu
        # Clear old contents without touching "." or "..".
        for path in /target/* /target/.[!.]* /target/..?*; do
          [ -e "$$path" ] || continue
          rm -rf -- "$$path"
        done
        # Copy the runner image filesystem, but skip pseudo-filesystems and the
        # target mount itself so procfs/sysfs entries do not get baked in.
        tar -C / \
          --exclude=./target \
          --exclude=./dev \
          --exclude=./proc \
          --exclude=./sys \
          --exclude=./tmp \
          -cf - . | tar -C /target -xf -
        echo "runner rootfs ready"
    volumes:
      - runner-rootfs:/target
    restart: "no"

  api:
    image: zerocode-service:dev
    environment:
      DATABASE_URL: postgres://zerocode:zerocode@postgres:5432/zerocode
      ZEROCODE_API_BIND: 0.0.0.0:8080
      # tower_governor caps per-IP request volume. The 100/100 prod default
      # is fine for real users but trips quickly under dev hammering, so the
      # dev compose cranks it up.
      ZEROCODE_GOVERNOR_RPS: ${ZEROCODE_GOVERNOR_RPS:-10000}
      ZEROCODE_GOVERNOR_BURST: ${ZEROCODE_GOVERNOR_BURST:-10000}
      RUST_LOG: info,zerocode=debug
    depends_on:
      migrate:
        condition: service_completed_successfully
    labels:
      - traefik.enable=true
      - traefik.domain=youngstorage.in
      - traefik.http.routers.zero-code.rule=Host(`zerocode.dev.succeedex.in`)
      - traefik.http.routers.zero-code.entrypoints=websecure
      - traefik.http.routers.zero-code.tls=true
      - traefik.http.routers.zero-code.tls.certresolver=myresolver
      - traefik.http.services.zero-code.loadbalancer.server.port=8080
    # The image bakes the built `web/dist/` at /srv/web (see deploy/Dockerfile.service,
    # which runs `pnpm build` in a node:20 stage). ZEROCODE_WEB_DIR is set to
    # /srv/web by the Dockerfile, so the API picks it up automatically.
    # For dev hot-reload of the UI, run `pnpm --filter @zerocode/app dev`
    # separately at http://localhost:5173 and disable the embedded mount with
    # ZEROCODE_WEB_DIR="" .
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ "ALL" ]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - default

  worker:
    image: zerocode-worker:dev
    environment:
      DATABASE_URL: postgres://zerocode:zerocode@postgres:5432/zerocode
      ZEROCODE_WORKER_ID: worker-1
      ZEROCODE_RUNNER_ROOTFS: /var/lib/zerocode/runner-rootfs
      RUST_LOG: info,zerocode=debug
    depends_on:
      migrate:
        condition: service_completed_successfully
      runner-rootfs-init:
        condition: service_completed_successfully
    volumes:
      # Read-write in dev mode so NaiveSandbox can create per-job workdirs at
      # <rootfs>/box/<token> before chroot()-ing into the rootfs. In a
      # NativeSandbox deployment this should go back to :ro.
      - runner-rootfs:/var/lib/zerocode/runner-rootfs:rw
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cap_drop: [ "ALL" ]
    cap_add:
      # Needed inside the worker's own user namespace for unshare/mount/pivot_root.
      - SYS_ADMIN
      # Needed by NaiveSandbox to chroot() into the runner rootfs.
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
    cgroup: private
    restart: unless-stopped

volumes:
  pg-data:
  runner-rootfs:

networks:
  default:
    name: traefik
    external: true
