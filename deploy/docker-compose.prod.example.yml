# Production-shaped Docker Compose example for ZeroCode.
#
# This file is a STARTING POINT — copy it, rename it, and edit it. Specifically:
#
#   1. Replace every `__CHANGE_ME__` placeholder (Postgres password) with a
#      real secret. ZeroCode itself is an unauthenticated backend; restrict
#      who can reach :8080 via the network layer (private subnet, firewall,
#      reverse proxy with auth in front, VPN, etc.).
#   2. Pin image tags (`:v0.1.0`) instead of `:latest`; rebuild deliberately.
#   3. Decide where Postgres lives — managed (RDS/Cloud SQL) is recommended
#      over running it in the same compose for prod.
#   4. Front the API with a TLS-terminating reverse proxy if you expose it
#      beyond a private network. See ../docs/DEPLOY.md §5.
#   5. Confirm host prereqs: kernel >= 5.14, cgroup v2 unified, unprivileged
#      user namespaces enabled. See ../docs/DEPLOY.md §1.
#
# Once secrets are populated, bring up with:
#   docker compose -f deploy/docker-compose.prod.yml up -d
#
# Worker scaling: replicate the `worker` service with --scale, or run
# multiple compose files on multiple hosts pointing at the same Postgres.

name: zerocode

services:
  postgres:
    # Prefer a managed Postgres in real production. This in-compose Postgres
    # is fine for single-host deployments but loses durability guarantees the
    # moment you outgrow one box.
    image: postgres:16
    environment:
      POSTGRES_USER: zerocode
      POSTGRES_PASSWORD: __CHANGE_ME__
      POSTGRES_DB: zerocode
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zerocode"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    image: zerocode-service:v0.1.0
    entrypoint: ["/usr/local/bin/zerocode-migrate"]
    command:
      - --database-url=postgres://zerocode:__CHANGE_ME__@postgres:5432/zerocode
      - --migrations-dir=/var/lib/zerocode/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  runner-rootfs-init:
    # One-shot: extracts the runner image filesystem into a shared volume
    # so the worker can mount it as the sandbox rootfs.
    image: zerocode-runner:v0.1.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for path in /target/* /target/.[!.]* /target/..?*; do
          [ -e "$$path" ] || continue
          rm -rf -- "$$path"
        done
        tar -C / \
          --exclude=./target \
          --exclude=./dev \
          --exclude=./proc \
          --exclude=./sys \
          --exclude=./tmp \
          -cf - . | tar -C /target -xf -
        echo "runner rootfs ready"
    volumes:
      - runner-rootfs:/target
    restart: "no"

  api:
    image: zerocode-service:v0.1.0
    environment:
      DATABASE_URL: postgres://zerocode:__CHANGE_ME__@postgres:5432/zerocode
      ZEROCODE_API_BIND: 0.0.0.0:8080
      # Per-IP rate limit. ZeroCode runs as an unauthenticated internal
      # backend — the governor is the only client-volume guard. Tune for
      # your traffic shape.
      ZEROCODE_GOVERNOR_RPS: "100"
      ZEROCODE_GOVERNOR_BURST: "100"
      RUST_LOG: info
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Bind to localhost — the TLS-terminating reverse proxy on the host
    # exposes :443 publicly. Never expose plain HTTP on 0.0.0.0 in prod.
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  worker:
    image: zerocode-worker:v0.1.0
    environment:
      DATABASE_URL: postgres://zerocode:__CHANGE_ME__@postgres:5432/zerocode
      ZEROCODE_WORKER_ID: worker-1
      ZEROCODE_RUNNER_ROOTFS: /var/lib/zerocode/runner-rootfs
      RUST_LOG: info
    depends_on:
      migrate:
        condition: service_completed_successfully
      runner-rootfs-init:
        condition: service_completed_successfully
    volumes:
      # Runner rootfs must be writable so the worker can create per-job
      # workdirs at <rootfs>/box/<token> and bind-mount /proc + /dev into
      # it. The sandbox-internal isolation prevents user code from
      # actually mutating toolchain files.
      - runner-rootfs:/var/lib/zerocode/runner-rootfs:rw
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cap_drop: ["ALL"]
    cap_add:
      # Required for unshare(), mount(), pivot_root(), and for bind-mounting
      # /proc into the runner rootfs. Scoped to the worker's user namespace.
      - SYS_ADMIN
      # Required to chroot() into the runner rootfs.
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
    cgroup: private
    restart: unless-stopped
    # Scale horizontally by adding replicas. Each worker should have a
    # unique ZEROCODE_WORKER_ID; set it via templating or `--scale`-aware
    # orchestration (Kubernetes, Nomad).
    # deploy:
    #   replicas: 4

volumes:
  pg-data:
  runner-rootfs:
