[package]
name = "zerocode-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "zerocode-worker"
path = "src/main.rs"

[features]
default = []
# Phase 1 plumbing only — enables NaiveSandbox so we can exercise the worker
# loop end-to-end before Phase 1.5's native sandbox lands.
unsafe-naive = ["zerocode-sandbox/unsafe-naive"]
native = ["zerocode-sandbox/native"]
# v2 WASM tier — enables WasmSandbox dispatch for languages with tier=wasm.
# Cross-platform; safe to combine with `native`.
wasm = ["zerocode-sandbox/wasm"]

[dependencies]
zerocode-core = { path = "../zerocode-core" }
zerocode-sandbox = { path = "../zerocode-sandbox" }
zerocode-cache = { path = "../zerocode-cache" }
zerocode-stream = { path = "../zerocode-stream" }

tokio = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }
ulid = { workspace = true }
futures = { workspace = true }
tokio-stream = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
reqwest = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
axum = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
metrics-process = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true }
