[package]
name = "zerocode-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# Phase 1 plumbing only — spawns subprocesses with a wall-clock timeout and NO
# isolation. NEVER enable in production. Gated so binaries cannot accidentally
# ship without the real sandbox.
unsafe-naive = []
# Phase 1.5+: real NativeSandbox. Pure-Rust direct primitives (cgroup v2 +
# namespaces + cap-drop). The actual implementation is also gated on
# `target_os = "linux"`; on other platforms this feature compiles but the
# sandbox returns `KernelFeatureMissing` at runtime.
native = []
# Phase 2 hardening — adds seccomp + landlock + libcontainer integration.
native-hardened = ["native"]
edge-cases = ["native"]
# v2 WASM tier: alternative cross-platform Sandbox impl backed by wasmtime
# + WASI preview1. Accepts a pre-compiled `.wasm` blob in
# `SandboxJob.source_code` and runs `_start` under fuel + memory +
# wall-time limits. Works on macOS dev hosts.
wasm = ["dep:wasmtime", "dep:wasmtime-wasi"]

[dependencies]
zerocode-core = { path = "../zerocode-core" }

tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
bytes = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }

# v2 WASM tier — feature-gated.
wasmtime = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }

[dev-dependencies]
# `wat` lets the WasmSandbox unit tests embed inline `.wat` text instead of
# checking compiled `.wasm` bytes into the repo.
wat = "1"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# Linux primitives. macOS dev hosts skip these entirely; the `native` module
# is `#[cfg(target_os = "linux")]`-gated internally so the workspace still
# builds + tests cross-platform.
[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true }
caps = { workspace = true }
libseccomp = { workspace = true }
landlock = { workspace = true }
libc = "0.2"

# Future v2 hardening — pulled in by `native-hardened` only when libcontainer
# replaces the current direct-primitive implementation.
libcontainer = { workspace = true, optional = true }
libcgroups = { workspace = true, optional = true }
oci-spec = { workspace = true, optional = true }
cgroups-rs = { workspace = true, optional = true }
