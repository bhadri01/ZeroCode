<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ZeroCode · Code Space</title>
  <link rel="stylesheet" href="shared/tokens.css?v=2" />
  <script src="shared/theme.js?v=2"></script>
  <script>
    // Surface any error from shared/api.js during its sync evaluation, so a
    // load failure (404, CSP, syntax) is visible in DevTools and in the page
    // — otherwise the symptom is just "no ZeroCode API reachable" downstream.
    window.__zcApiLoadError = null;
    window.addEventListener('error', function (e) {
      if (e?.filename && e.filename.indexOf('shared/api.js') !== -1) {
        window.__zcApiLoadError = (e.message || 'unknown') + ' @ ' + (e.lineno || '?') + ':' + (e.colno || '?');
      }
    }, true);
  </script>
  <script src="shared/api.js?v=4"></script>
  <script>
    // Sanity check: by the time this synchronous script runs, api.js has
    // either finished or thrown. Capture the result for the React app.
    window.__zcApiReady = (typeof window.ZeroCodeAPI === 'object');
  </script>
  <style>
    html, body { background: var(--bg); height: 100%; overflow: hidden; }
    #app { height: 100vh; display: flex; flex-direction: column; }
    @media (max-width: 760px) {
      html, body { overflow: auto; height: auto; }
      #app { height: auto; min-height: 100vh; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="playground/data.jsx?v=4"></script>
  <script type="text/babel" src="playground/app.jsx?v=4"></script>
</body>
</html>
